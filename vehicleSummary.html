/* =====================================================
   NORMALIZE
===================================================== */

function normalize(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/<br\s*\/?>/gi, " ")
        .replace(/\u00a0/g, " ")
        .replace(/[\r\n\t]+/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .toUpperCase();

}


/* =====================================================
   NUMBER
===================================================== */

function numberValue(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return 0;
    }

    const text =
        String(value)
            .replace(/,/g, "")
            .replace(/[^\d.-]/g, "");

    const num = parseFloat(text);

    return isNaN(num) ? 0 : num;

}


/* =====================================================
   FORMAT NUMBER
===================================================== */

function formatNumber(value) {

    if (!isFinite(value)) {
        return "0";
    }

    return Number(value).toLocaleString(
        "en-US",
        {
            maximumFractionDigits: 3
        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   FIND COLUMN
===================================================== */

function findColumn(row, names) {

    const keys = Object.keys(row);

    for (const name of names) {

        const target = normalize(name);

        const exact = keys.find(
            key => normalize(key) === target
        );

        if (exact) {
            return exact;
        }

    }

    for (const name of names) {

        const target = normalize(name);

        const partial = keys.find(key => {

            const current = normalize(key);

            return (
                current.includes(target) ||
                target.includes(current)
            );

        });

        if (partial) {
            return partial;
        }

    }

    return null;

}


/* =====================================================
   EXCEL UPLOAD
===================================================== */

document
    .getElementById("excelFile")
    .addEventListener(
        "change",
        function(event) {

            const file = event.target.files[0];

            if (!file) {
                return;
            }

            const reader = new FileReader();

            reader.onload = function(e) {

                try {

                    const data =
                        new Uint8Array(
                            e.target.result
                        );

                    const workbook =
                        XLSX.read(
                            data,
                            {
                                type: "array",
                                cellDates: true
                            }
                        );

                    const sheet =
                        workbook.Sheets[
                            workbook.SheetNames[0]
                        ];

                    excelRows =
                        XLSX.utils.sheet_to_json(
                            sheet,
                            {
                                defval: "",
                                raw: false
                            }
                        );

                    const status =
                        document.getElementById(
                            "fileStatus"
                        );

                    status.innerHTML =
                        "Excel loaded successfully: " +
                        excelRows.length +
                        " rows.";

                    status.style.color =
                        "#198754";

                }
                catch(error) {

                    console.error(error);

                    const status =
                        document.getElementById(
                            "fileStatus"
                        );

                    status.innerHTML =
                        "Error reading Excel file.";

                    status.style.color =
                        "#dc3545";

                }

            };

            reader.readAsArrayBuffer(file);

        }
    );

/* =====================================================
   PASTE PARSER
===================================================== */

function parsePastedData(text) {

    if (!text.trim()) {
        return [];
    }

    const lines =
        text
            .split(/\r?\n/)
            .map(x => x.trim())
            .filter(x => x !== "");

    if (!lines.length) {
        return [];
    }

    let delimiter = "\t";

    if (!lines[0].includes("\t")) {

        if (lines[0].includes("|")) {
            delimiter = "|";
        }
        else {
            delimiter = /\s{2,}/;
        }

    }

    const headers =
        lines[0]
            .split(delimiter)
            .map(x => normalize(x));

    const result = [];

    for (
        let i = 1;
        i < lines.length;
        i++
    ) {

        const cols =
            lines[i].split(delimiter);

        if (cols.length <= 1) {
            continue;
        }

        const obj = {};

        headers.forEach(
            (header, index) => {

                obj[header] =
                    cols[index] !== undefined
                        ? cols[index].trim()
                        : "";

            }
        );

        result.push(obj);

    }

    return result;

}

/* =====================================================
   DATE NORMALIZE
===================================================== */

function normalizeDateForFilter(value) {

    if (
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ) {
        return "";
    }

    let text =
        String(value).trim();

    let m =
        text.match(
            /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/
        );

    if (m) {

        const day =
            String(m[1]).padStart(2, "0");

        const monthNumber =
            parseInt(m[2], 10);

        const year = m[3];

        const months = [
            "Jan","Feb","Mar","Apr",
            "May","Jun","Jul","Aug",
            "Sep","Oct","Nov","Dec"
        ];

        if (
            monthNumber >= 1 &&
            monthNumber <= 12
        ) {

            return (
                day +
                "-" +
                months[monthNumber - 1] +
                "-" +
                year
            );

        }

    }

    const date = new Date(text);

    if (!isNaN(date.getTime())) {
        return formatGateOutDate(date);
    }

    return text;

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatGateOutDate(date) {

    const day =
        String(date.getDate())
            .padStart(2, "0");

    const months = [
        "Jan","Feb","Mar","Apr",
        "May","Jun","Jul","Aug",
        "Sep","Oct","Nov","Dec"
    ];

    return (
        day +
        "-" +
        months[date.getMonth()] +
        "-" +
        date.getFullYear()
    );

}

/* =====================================================
   BUILD DATE FILTER
===================================================== */

function buildGateOutDateFilter() {

    const select =
        document.getElementById(
            "gateOutDateFilter"
        );

    if (!select) {
        return;
    }

    const oldSelected =
        Array.from(
            select.selectedOptions
        ).map(
            option => option.value
        );

    select.innerHTML = "";

    const dates = new Set();

    let hasBlank = false;

    inputRows.forEach(row => {

        const formatted =
            normalizeDateForFilter(
                row.gateOutDate
            );

        if (formatted) {
            dates.add(formatted);
        }
        else {
            hasBlank = true;
        }

    });

    const sortedDates =
        [...dates].sort((a, b) => {

            const parse = x => {

                const parts =
                    x.split("-");

                if (parts.length !== 3) {
                    return new Date(x);
                }

                const monthMap = {
                    Jan: 0,
                    Feb: 1,
                    Mar: 2,
                    Apr: 3,
                    May: 4,
                    Jun: 5,
                    Jul: 6,
                    Aug: 7,
                    Sep: 8,
                    Oct: 9,
                    Nov: 10,
                    Dec: 11
                };

                return new Date(
                    Number(parts[2]),
                    monthMap[parts[1]],
                    Number(parts[0])
                );

            };

            return parse(a) - parse(b);

        });

    sortedDates.forEach(date => {

        const option =
            document.createElement("option");

        option.value = date;

        option.textContent = date;

        if (oldSelected.includes(date)) {
            option.selected = true;
        }

        select.appendChild(option);

    });

    if (hasBlank) {

        const option =
            document.createElement("option");

        option.value = "__BLANK__";

        option.textContent = "Blank";

        if (
            oldSelected.includes(
                "__BLANK__"
            )
        ) {
            option.selected = true;
        }

        select.appendChild(option);

    }

}

        return selected.includes(date);

}

/* =====================================================
   CUSTOMER MAPPING
===================================================== */

function getMappedCustomer(customer, location) {

    const combined =
        normalize(
            customer +
            " " +
            location
        );

    for (const item of customerMap) {

        const source =
            normalize(item[0]);

        if (
            combined === source ||
            combined.includes(source) ||
            source.includes(combined)
        ) {

            return item[1];

        }

    }

    const checks = [

        [/APEX FOOTWEAR/, "APEX"],
        [/JINNAT APPARELS/, "JINNAT"],
        [/JINNAT FASHIONS/, "JINNAT"],
        [/JINNAT KNITWEARS.*FFL2/, "FFL2"],
        [/FFL2/, "FFL2"],
        [/JKL-U2/, "JKL-2"],
        [/JKL-1/, "JINNAT"],
        [/GLORY TEXTILES/, "GLORY"],
        [/GLORY TEXTILE/, "GLORY"],
        [/FOOTBED/, "FOOTBED"],
        [/UTAH KNITTING/, "UTAH KNITING"],
        [/UTAH FASHIONS/, "UTAH FASHION"],
        [/FAVRICA|FABRICA/, "FAVRICA"],
        [/T\.K\. FOOTWEAR/, "T.K. FOOTWEAR"],
        [/PARASOLE/, "PARASOL"],
        [/BONSHOE/, "BONSHOE"],
        [/MATIN SPINNING/, "MATIN"],
        [/MEHNAZ/, "MEHNAZ"],
        [/COLOR CITY/, "COLOR"],
        [/PARKWAY/, "PARKWAY"],
        [/TEXTILE TESTING/, "TTSL"],
        [/EU DESIGN/, "EU DESIGN"],
        [/EUDB/, "EUDB"],
        [/DB TEX/, "DB TEX"],
        [/NUOVO SHOES/, "NUOVO SHOES"],
        [/OMC FOOTWEAR/, "OMC"],
        [/HAMZA TEXTILES/, "HAMZA"],
        [/COMFIT/, "COMFIT"],
        [/DBL CERAMICS/, "CERAMICS"],
        [/DBL PHARMACEUTICALS/, "PRHARMA"],
        [/MATRIGHOR/, "MATRIGH"],
        [/VULUA/, "VULUA"],
        [/THANBEE/, "THANBE"],
        [/FB FOOTWEAR/, "FB"]

    ];

    for (const [regex, value] of checks) {

        if (regex.test(combined)) {
            return value;
        }

    }

    return customer || "Unknown";

}


/* =====================================================
   MATCH GATE PASS
===================================================== */

function getMatchedRows(excelData, pastedData) {

    const gatePassSet =
        new Set();

    const vehicleMap =
        new Map();

    pastedData.forEach(row => {

        const key =
            normalize(row.gatePass);

        if (!key) {
            return;
        }

        gatePassSet.add(key);

        if (!vehicleMap.has(key)) {

            vehicleMap.set(
                key,
                []
            );

        }

        if (row.vehicle) {

            vehicleMap
                .get(key)
                .push(row.vehicle);

        }

    });

    return excelData

        .filter(row => {

            return gatePassSet.has(
                normalize(row.gatePass)
            );

        })

        .map(row => {

            const key =
                normalize(row.gatePass);

            const vehicles = [
                ...new Set(
                    (
                        vehicleMap.get(key) ||
                        []
                    ).filter(Boolean)
                )
            ];

            return {

                ...row,

                mappedCustomer:
                    getMappedCustomer(
                        row.customer,
                        row.location
                    ),

                matchedVehicles:
                    vehicles

            };

        });

}


/* =====================================================
   DISTINCT
===================================================== */

function distinctCount(rows, field) {

    const set =
        new Set();

    rows.forEach(row => {

        const value =
            normalize(row[field]);

        if (value) {
            set.add(value);
        }

    });

    return set.size;

}


/* =====================================================
   SUM
===================================================== */

function sumField(rows, field) {

    return rows.reduce(
        (total, row) => {

            return (
                total +
                numberValue(
                    row[field]
                )
            );

        },
        0
    );

}


/* =====================================================
   SUMMARY
===================================================== */

function makeSummary(label, rows) {

    return {

        label,

        gatePass:
            distinctCount(
                rows,
                "gatePass"
            ),

        challan:
            distinctCount(
                rows,
                "challan"
            ),

        quantity:
            sumField(
                rows,
                "quantity"
            ),

        netWeight:
            sumField(
                rows,
                "netWeight"
            ),

        bagCtn:
            sumField(
                rows,
                "bagCtn"
            )

    };

}

/* =====================================================
   COPY VEHICLE SUMMARY
===================================================== */

async function copyVehicleSummary(
    vehicle,
    summary
) {

    const text =
        getVehicleSummaryText(
            vehicle,
            summary
        );

    try {

        await navigator.clipboard.writeText(
            text
        );

        const buttons =
            document.querySelectorAll(
                ".copy-summary-btn"
            );

        buttons.forEach(btn => {

            if (
                btn.dataset.vehicle ===
                vehicle
            ) {

                const oldText =
                    btn.innerText;

                btn.innerText =
                    "✓ Copied";

                setTimeout(
                    () => {

                        btn.innerText =
                            oldText;

                    },
                    1500
                );

            }

        });

    }
    catch(error) {

        const textarea =
            document.createElement(
                "textarea"
            );

        textarea.value = text;

        textarea.style.position =
            "fixed";

        textarea.style.left =
            "-9999px";

        document.body.appendChild(
            textarea
        );

        textarea.select();

        document.execCommand(
            "copy"
        );

        document.body.removeChild(
            textarea
        );

        alert(
            "Vehicle summary copied."
        );

    }

}


/* =====================================================
   GENERATE REPORT
===================================================== */

function generateReport() {

    const status =
        document.getElementById(
            "pasteStatus"
        );

    if (!excelRows.length) {

        status.style.color =
            "#dc3545";

        status.innerHTML =
            "Please upload Excel file first.";

        return;

    }

    if (!inputRows.length) {

        status.style.color =
            "#dc3545";

        status.innerHTML =
            "Please load paste data first.";

        return;

    }

    const filteredInputRows =
        getFilteredInputRows();

    const pastedData =
        filteredInputRows.map(row => ({

            gatePass:
                String(
                    row.gatePass || ""
                ).trim(),

            vehicle:
                String(
                    row.vehicle || ""
                ).trim()

        }));

    if (!pastedData.length) {

        status.style.color =
            "#dc3545";

        status.innerHTML =
            "No rows available after filter.";

        return;

    }

    const excelData =
        prepareExcelData();

    const matchedRows =
        getMatchedRows(
            excelData,
            pastedData
        );

    if (!matchedRows.length) {

        status.style.color =
            "#dc3545";

        status.innerHTML =
            "No matching Gate Pass No found.";

        document.getElementById(
            "vehicleTables"
        ).innerHTML = `

            <div class="py-[25px] text-center text-[#777]">
                No matching Gate Pass No found.
            </div>

        `;

        return;

    }

    const vehicleGroups =
        new Map();

    matchedRows.forEach(row => {

        let vehicles =
            row.matchedVehicles;

        if (!vehicles.length) {

            vehicles = [
                row.vehicle ||
                "Unknown"
            ];

        }

        vehicles.forEach(vehicle => {

            const key =
                vehicle.trim() ||
                "Unknown";

            if (
                !vehicleGroups.has(key)
            ) {

                vehicleGroups.set(
                    key,
                    []
                );

            }

            vehicleGroups
                .get(key)
                .push(row);

        });

    });

    renderVehicleWise(
        vehicleGroups
    );

    document.getElementById(
        "reportDate"
    ).innerText =
        "Generated: " +
        new Date().toLocaleString();

    status.style.color =
        "#198754";

    status.innerHTML =
        "Report generated successfully. " +
        matchedRows.length +
        " matching Excel rows found.";

}

                                        ${formatNumber(
                                            gateSummary.quantity
                                        )}
                                    </td>

                                    <td>
                                        ${formatNumber(
                                            gateSummary.netWeight
                                        )}
                                    </td>

                                    <td>
                                        ${formatNumber(
                                            gateSummary.bagCtn
                                        )}
                                    </td>

                                </tr>

                            `;

                        }
                    );

                }
            );


            html += `

                        </tbody>

                    </table>

                </div>

            `;


            block.innerHTML = html;

            container.appendChild(block);

        }
    );

}


/* =====================================================
   PRINT
===================================================== */

function printPDF() {

    const report =
        document.getElementById(
            "vehicleTables"
        );

    if (
        !report ||
        report.innerText.trim() === "" ||
        report.innerText.includes(
            "Generate report"
        )
    ) {

        alert(
            "Please generate report first."
        );

        return;

    }

    window.print();

}

/* =====================================================

===================================================== */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            (e.ctrlKey || e.metaKey) &&
            e.key.toLowerCase() === "p"
        ) {

            e.preventDefault();

            printPDF();

        }

    }
);
