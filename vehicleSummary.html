<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vehicle Summary - SH Group</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="css/index.css"
    >

</head>


<body class="min-h-screen bg-[#f5f5f5]">

    <!-- HEADER -->

    <div id="header"></div>


    <!-- VEHICLE SUMMARY -->

    <main
        class="
            min-h-[calc(100vh-90px)]
            px-4
            py-8
            sm:px-6
            sm:py-10
        "
    >

        <div class="mx-auto w-full max-w-[1050px]">

            <div class="mb-8">

                <h1
                    class="
                        text-2xl
                        font-bold
                        text-[#222]
                        sm:text-3xl
                    "
                >
                    Vehicle Summary
                </h1>

                <p class="mt-1 text-sm text-[#777]">
                    Vehicle summary and information.
                </p>

            </div>


            <!-- YOUR VEHICLE SUMMARY CONTENT -->

            <div
                class="
                    rounded-2xl
                    bg-white
                    p-6
                    shadow-[0_5px_20px_rgba(0,0,0,0.07)]
                "
            >

                <p class="text-sm text-[#777]">
                    Vehicle Summary content will be here.
                </p>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <div id="footer"></div>


    <!-- MAIN JS -->

    <script src="js/script.js"></script>

</body>

</html>
