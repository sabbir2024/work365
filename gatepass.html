<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OGP Print - SH Group</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="css/index.css"
    >

</head>


<body class="min-h-screen bg-[#f5f5f5]">


    <!-- =========================================
         HEADER
    ========================================== -->

    <div id="header"></div>


    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main
        class="
            min-h-[calc(100vh-90px)]
            px-4
            py-8
            sm:px-6
            sm:py-10
        "
    >

        <div class="mx-auto w-full max-w-[1050px]">


            <!-- PAGE TITLE -->

            <div class="mb-8">

                <h1
                    class="
                        text-2xl
                        font-bold
                        text-[#222]
                        sm:text-3xl
                    "
                >
                    OGP Print
                </h1>

                <p
                    class="
                        mt-1
                        text-sm
                        text-[#777]
                    "
                >
                    Delivery Challan, Gate Pass and OGP printing tools.
                </p>

            </div>


            <!-- =====================================
                 GATEPASS CONTENT
            ====================================== -->

            <div
                class="
                    rounded-2xl
                    bg-white
                    p-6
                    shadow-[0_5px_20px_rgba(0,0,0,0.07)]
                "
            >

                <h2
                    class="
                        mb-4
                        text-xl
                        font-bold
                        text-[#222]
                    "
                >
                    Gate Pass Tools
                </h2>


                <div
                    class="
                        grid
                        grid-cols-1
                        gap-4
                        sm:grid-cols-2
                    "
                >

                    <!-- DELIVERY CHALLAN -->

                    <a
                        href="#"
                        class="
                            rounded-xl
                            border
                            border-[#e5e7eb]
                            bg-[#f8fafc]
                            p-5
                            no-underline
                            transition
                            hover:-translate-y-1
                            hover:border-[#319a82]
                            hover:shadow-md
                        "
                    >

                        <div class="mb-3 text-3xl">
                            📄
                        </div>

                        <h3
                            class="
                                mb-1
                                font-bold
                                text-[#222]
                            "
                        >
                            Delivery Challan
                        </h3>

                        <p
                            class="
                                text-sm
                                text-[#777]
                            "
                        >
                            Generate and print delivery challan.
                        </p>

                    </a>


                    <!-- DELIVERY GATE PASS -->

                    <a
                        href="#"
                        class="
                            rounded-xl
                            border
                            border-[#e5e7eb]
                            bg-[#f8fafc]
                            p-5
                            no-underline
                            transition
                            hover:-translate-y-1
                            hover:border-[#007bff]
                            hover:shadow-md
                        "
                    >

                        <div class="mb-3 text-3xl">
                            🚚
                        </div>

                        <h3
                            class="
                                mb-1
                                font-bold
                                text-[#222]
                            "
                        >
                            Delivery Gate Pass
                        </h3>

                        <p
                            class="
                                text-sm
                                text-[#777]
                            "
                        >
                            Generate delivery gate pass.
                        </p>

                    </a>


                    <!-- GATE PASS -->

                    <a
                        href="#"
                        class="
                            rounded-xl
                            border
                            border-[#e5e7eb]
                            bg-[#f8fafc]
                            p-5
                            no-underline
                            transition
                            hover:-translate-y-1
                            hover:border-[#9c27b0]
                            hover:shadow-md
                        "
                    >

                        <div class="mb-3 text-3xl">
                            🎫
                        </div>

                        <h3
                            class="
                                mb-1
                                font-bold
                                text-[#222]
                            "
                        >
                            Gate Pass
                        </h3>

                        <p
                            class="
                                text-sm
                                text-[#777]
                            "
                        >
                            Create and print gate pass.
                        </p>

                    </a>


                    <!-- VEHICLE SUMMARY -->

                    <a
                        href="vehicleSummary.html"
                        class="
                            rounded-xl
                            border
                            border-[#e5e7eb]
                            bg-[#f8fafc]
                            p-5
                            no-underline
                            transition
                            hover:-translate-y-1
                            hover:border-[#16a085]
                            hover:shadow-md
                        "
                    >

                        <div class="mb-3 text-3xl">
                            🚗
                        </div>

                        <h3
                            class="
                                mb-1
                                font-bold
                                text-[#222]
                            "
                        >
                            Vehicle Summary
                        </h3>

                        <p
                            class="
                                text-sm
                                text-[#777]
                            "
                        >
                            View vehicle summary information.
                        </p>

                    </a>

                </div>

            </div>

        </div>

    </main>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <div id="footer"></div>


    <!-- =========================================
         MAIN JAVASCRIPT
    ========================================== -->

    <script src="js/script.js"></script>

</body>

</html>
