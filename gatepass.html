<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="icon"
        href="https://reportsrv.dbl-group.com:8090/ords/r/bpm/files/static/v32/img/logodbl.png"
    >

    <title>OGP Print</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    keyframes: {
                        checkPop: {
                            "0%": {
                                transform: "scale(0)",
                                opacity: "0"
                            },
                            "70%": {
                                transform: "scale(1.25)",
                                opacity: "1"
                            },
                            "100%": {
                                transform: "scale(1)",
                                opacity: "1"
                            }
                        },

                        blinkCursor: {
                            "0%, 50%": {
                                opacity: "1"
                            },
                            "51%, 100%": {
                                opacity: "0"
                            }
                        }
                    },

                    animation: {
                        checkPop:
                            "checkPop 0.3s ease",

                        blinkCursor:
                            "blinkCursor 0.7s infinite"
                    }
                }
            }
        };
    </script>

</head>


<body
>


    <!-- ============================================
         HEADER
    ============================================= -->

   <div id="header" ></div>


    <!-- ============================================
         MAIN PAGE
    ============================================= -->

    <main id="mainPage" class="mt-3">

       


        <!-- ========================================
             MAIN CONTAINER
        ======================================== -->

        <div
            class="
                mx-auto
                max-w-[500px]
                rounded-[10px]
                bg-white
                p-[25px]
                shadow-[0_2px_10px_rgba(0,0,0,0.1)]
            "
        >


            <!-- ====================================
                 EYES
            ==================================== -->

            <div
                id="eyesContainer"
                class="
                    mb-3
                    flex
                    h-[70px]
                    items-center
                    justify-center
                    gap-[18px]
                "
            >

                <div
                    class="
                        eye
                        relative
                        h-[58px]
                        w-[58px]
                        overflow-hidden
                        rounded-full
                        border-[3px]
                        border-[#333]
                        bg-white
                        shadow-[0_2px_5px_rgba(0,0,0,0.15)]
                    "
                >

                    <div
                        class="
                            pupil
                            absolute
                            left-1/2
                            top-1/2
                            h-[25px]
                            w-[25px]
                            -translate-x-1/2
                            -translate-y-1/2
                            rounded-full
                            bg-[#111]
                            transition-transform
                            duration-[40ms]
                            ease-linear
                        "
                    ></div>

                    <div
                        class="
                            pointer-events-none
                            absolute
                            left-3
                            top-[11px]
                            z-[3]
                            h-3
                            w-3
                            rounded-full
                            bg-white
                        "
                    ></div>

                </div>


                <div
                    class="
                        eye
                        relative
                        h-[58px]
                        w-[58px]
                        overflow-hidden
                        rounded-full
                        border-[3px]
                        border-[#333]
                        bg-white
                        shadow-[0_2px_5px_rgba(0,0,0,0.15)]
                    "
                >

                    <div
                        class="
                            pupil
                            absolute
                            left-1/2
                            top-1/2
                            h-[25px]
                            w-[25px]
                            -translate-x-1/2
                            -translate-y-1/2
                            rounded-full
                            bg-[#111]
                            transition-transform
                            duration-[40ms]
                            ease-linear
                        "
                    ></div>

                    <div
                        class="
                            pointer-events-none
                            absolute
                            left-3
                            top-[11px]
                            z-[3]
                            h-3
                            w-3
                            rounded-full
                            bg-white
                        "
                    ></div>

                </div>

            </div>


            <!-- ====================================
                 TITLE
            ==================================== -->

            <h2
                class="
                    mb-5
                    mt-0
                    text-center
                    text-2xl
                    font-bold
                "
            >
                OGP Print
            </h2>


            <!-- ====================================
                 SESSION AREA
            ==================================== -->

            <div id="sessionArea">

                <div
                    class="
                        mb-[7px]
                        flex
                        items-center
                        justify-between
                    "
                >

                    <div class="text-sm font-bold">
                        Paste Report Link
                    </div>


                    <a
                        href="https://reportsrv.dbl-group.com:8090/ords/r/bpm/accessories/home"
                        target="_blank"
                        class="
                            inline-block
                            rounded-[5px]
                            bg-[#28a745]
                            px-[14px]
                            py-1.5
                            text-center
                            text-[13px]
                            font-bold
                            text-white
                            no-underline
                            transition
                            hover:-translate-y-px
                            hover:bg-[#218838]
                        "
                    >
                        Session↗️
                    </a>

                </div>


                <div class="relative mb-[15px] w-full">

                    <input
                        type="text"
                        id="sessionInput"
                        placeholder="Paste report link here"
                        class="
                            w-full
                            rounded-[5px]
                            border
                            border-[#ccc]
                            p-3
                            pr-[42px]
                            text-base
                            outline-none
                            transition
                            focus:border-[#007bff]
                        "
                    >


                    <button
                        type="button"
                        id="sessionClearBtn"
                        class="
                            absolute
                            right-2.5
                            top-2
                            z-[5]
                            hidden
                            h-[27px]
                            w-[27px]
                            rounded-full
                            border-0
                            bg-[#999]
                            p-0
                            text-xl
                            leading-[25px]
                            text-white
                            transition
                            hover:scale-[1.08]
                            hover:bg-[#555]
                        "
                    >
                        ×
                    </button>

                </div>

            </div>


            <!-- ====================================
                 SESSION SUCCESS
            ==================================== -->

            <div
                id="sessionSuccess"
                class="
                    mb-2.5
                    hidden
                    text-2xl
                    font-bold
                    text-[#28a745]
                    animate-checkPop
                "
            >
                Session ✓
            </div>


            <!-- ====================================
                 CREATOR
            ==================================== -->

            <div
                id="creator"
                class="
                    mb-2.5
                    -mt-0.5
                    hidden
                    min-h-4
                    overflow-hidden
                    whitespace-nowrap
                    text-[13px]
                    italic
                    text-[#666]
                "
            ></div>


            <!-- ====================================
                 SESSION INFO
            ==================================== -->

            <div
                id="sessionInfoWrapper"
                class="
                    relative
                    mb-[15px]
                    -mt-[5px]
                    hidden
                    overflow-hidden
                    rounded-lg
                    p-[3px]
                "
                style="--progress: 0;"
            >

                <div
                    class="
                        relative
                        z-[1]
                        m-0
                        rounded-[5px]
                        bg-[#f1f8ff]
                        p-2.5
                        text-sm
                        leading-6
                    "
                >

                    <div>

                        <strong>
                            Session ID:
                        </strong>

                        <span
                            id="sessionId"
                            class="break-all text-[#333]"
                        >
                            ---
                        </span>

                    </div>


                    <div>

                        <strong>
                            Session Time:
                        </strong>

                        <span
                            id="countdown"
                            class="
                                text-base
                                font-bold
                                text-[#007bff]
                            "
                        >
                            300
                        </span>

                        seconds

                    </div>

                </div>

            </div>


            <!-- ====================================
                 OGP NUMBER
            ==================================== -->

            <div class="mb-[7px] text-sm font-bold">
                OGP Number
            </div>


            <div class="relative mb-[15px] w-full">

                <div class="flex w-full items-center gap-1.5">

                    <button
                        type="button"
                        id="ogpMinusBtn"
                        class="
                            h-[42px]
                            w-[42px]
                            flex-none
                            rounded-md
                            border-0
                            bg-[#007bff]
                            p-0
                            text-2xl
                            font-bold
                            leading-[42px]
                            text-white
                            transition
                            hover:bg-[#0056b3]
                            active:scale-95
                        "
                    >
                        −
                    </button>


                    <input
                        type="text"
                        id="ogpInput"
                        placeholder="Enter OGP Number"
                        class="
                            min-w-0
                            flex-1
                            rounded-[5px]
                            border
                            border-[#ccc]
                            p-3
                            pr-[42px]
                            text-base
                            outline-none
                            transition
                            focus:border-[#007bff]
                        "
                    >


                    <button
                        type="button"
                        id="ogpPlusBtn"
                        class="
                            h-[42px]
                            w-[42px]
                            flex-none
                            rounded-md
                            border-0
                            bg-[#007bff]
                            p-0
                            text-2xl
                            font-bold
                            leading-[42px]
                            text-white
                            transition
                            hover:bg-[#0056b3]
                            active:scale-95
                        "
                    >
                        +
                    </button>

                </div>


                <button
                    type="button"
                    id="ogpClearBtn"
                    class="
                        absolute
                        right-[58px]
                        top-2
                        z-[5]
                        hidden
                        h-[27px]
                        w-[27px]
                        rounded-full
                        border-0
                        bg-[#999]
                        p-0
                        text-xl
                        leading-[25px]
                        text-white
                        transition
                        hover:scale-[1.08]
                        hover:bg-[#555]
                    "
                >
                    ×
                </button>

            </div>


            <!-- ====================================
                 LINKS
            ==================================== -->

            <div id="links"></div>

        </div>

    </main>




    <!-- ============================================
         JAVASCRIPT
    ============================================= -->

    <script src="js/script.js"></script>
    <script src="js/main.js"></script>


</body>

</html>
