<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

<meta
 name="viewport"
 content="width=device-width, initial-scale=1.0"
/>

  <title>Work365</title>

  <!-- Tailwind CSS -->

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React -->

  <script
    src="https://unpkg.com/react@18/umd/react.development.js"
    crossorigin
  ></script>

  <!-- React DOM -->

  <script
    src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    crossorigin
  ></script>

  <!-- React Router DOM -->

  <script
    src="https://unpkg.com/react-router-dom@6/umd/react-router-dom.development.js"
    crossorigin
  ></script>

  <!-- Babel -->

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .page-container {
      animation: pageIn 0.4s ease;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

</head>

<body class="bg-[#f5f5f5]">

  <div id="root"></div>

  <!-- =========================================
       COMPONENTS
       IMPORTANT:
       These files MUST NOT contain import/export
  ========================================== -->

  <script
    type="text/babel"
    src="./components/ExcelEditing.jsx"
  ></script>

  <script
    type="text/babel"
    src="./components/OGPPrint.jsx"
  ></script>

  <script
    type="text/babel"
    src="./components/VehicleSummary.jsx"
  ></script>

  <!-- =========================================
       LAYOUT
  ========================================== -->

  <script
    type="text/babel"
    src="./Layout.jsx"
  ></script>

  <!-- =========================================
       MAIN APP
  ========================================== -->

  <script type="text/babel">

    const {
      BrowserRouter,
      Routes,
      Route
    } = ReactRouterDOM;

    function App() {
      return (
        <BrowserRouter>

          <Routes>

            <Route element={<Layout />}>

              <Route
                path="/"
                element={<ExcelEditing />}
              />

              <Route
                path="/excel-editing"
                element={<ExcelEditing />}
              />

              <Route
                path="/ogp-print"
                element={<OGPPrint />}
              />

              <Route
                path="/vehicle-summary"
                element={<VehicleSummary />}
              />

            </Route>

          </Routes>

        </BrowserRouter>
      );
    }

    ReactDOM
      .createRoot(document.getElementById("root"))
      .render(<App />);

  </script>

</body>

</html>
